agent:
  model: "qwen3.5:9b"
  temperature: 0.15
  num_ctx: 4096
  cooldown_s: 0.5  # LLM Rate Limit
  request_timeout: 60
  status_interval_s: 1.5
  waiting_messages:
    - "Beklemedeyim..."
    - "Islem suruyor..."
    - "Hala isliyorum..."
  ollama_base_url: "http://127.0.0.1:11434"
  max_steps: 6

llm:
  provider: "ollama"
  single_model_mode: true
  model: "qwen3.5:9b"
  primary_model: "qwen3.5:9b"
  clm_fallback_enabled: false
  clm_fallback_model: ""
  fallback_on_missing_model: false
  fallback_on_error: false

ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen3.5:9b"
  request_timeout: 60

google_ai_studio:
  api_key: ""   # bos birakilirsa GOOGLE_API_KEY env kullanilir
  model: "gemma-4-31b-it"
  base_url: "https://generativelanguage.googleapis.com"
  request_timeout: 30

# Tek anahtar ile LLM + VLM + ESP URL degistir: active satirini degistir.
runtime_profile:
  active: google_ai_studio   # google_ai_studio | remote_ollama

  profiles:
    google_ai_studio:
      llm:
        provider: google_ai_studio
      agent:
        model: "gemma-4-31b-it"
        request_timeout: 45
      google_ai_studio:
        # api_key: profil bos birakir; ustteki google_ai_studio.api_key veya GOOGLE_API_KEY env
        model: "gemma-4-31b-it"
        request_timeout: 45
      vlm_bridge:
        llm:
          provider: google_ai_studio
        vision_llm:
          enabled: true
          provider: google_ai_studio
        ollama:
          endpoint: "@gateway/ollama/chat"
          timeout: 12.0
      arduino_serial:
        esp_base_url: "http://10.88.255.55:8080"
      esp_link:
        base_url: "http://10.88.255.55:8080"

    remote_ollama:
      llm:
        provider: ollama
      agent:
        model: "qwen3.5:9b"
        ollama_base_url: "http://127.0.0.1:11434"
        request_timeout: 60
      ollama:
        base_url: "http://127.0.0.1:11434"
        model: "qwen3.5:9b"
        request_timeout: 60
      vlm_bridge:
        llm:
          provider: ollama
        vision_llm:
          enabled: true
          provider: ollama
          base_url: "http://127.0.0.1:11434"
          model: "qwen3-vl:8b"
          timeout_s: 18
        ollama:
          endpoint: "@gateway/ollama/chat"
          model: "qwen3.5:9b"
          timeout: 12.0
      arduino_serial:
        esp_base_url: "http://10.88.255.55:8080"
      esp_link:
        base_url: "http://10.88.255.55:8080"

ollama_service:
  server:
    host: 0.0.0.0
    port: 8099
  persona:
    default: sentry
    dir: modules/ollama/config/personalities
  actions:
    endpoint: "@gateway/autonomy/apply_actions"
    default_apply: true
    timeout: 1.5
  translation:
    enabled: false   # Gemini handles Turkish natively; saves API quota
    default_source_lang: tr
    model: ""
    cache_size: 128

vlm_bridge:
  server:
    host: 0.0.0.0
    port: 8101
  vision:
    processing_mode: local
    camera_source: "@gateway/camera/video"
    context_max_age_s: 45
    confidence_threshold: 0.5
    face_match:
      ratio_test: 0.78
      min_good_matches: 5
      min_score: 0.08
    follow:
      enabled: true
      track_interval_s: 0.12
      pan_gain_deg: 50
      tilt_gain_deg: 32
      center_pan: 90
      center_tilt: 90
      min_pan: 35
      max_pan: 145
      min_tilt: 65
      max_tilt: 125
      max_lost_frames: 18
    blind_mode:
      enabled: false
      interval_seconds: 5.0
    modes:
      objects: true
      people: true
      faces: true
      depth: false
      ocr: false
      hazards: true
      semantic_scene: true
    alerts:
      classes: ["person"]
      distance_threshold_m: 1.2
      announce_interval_s: 8.0
    personalization:
      known_people:
        Alice:
          greeting: "Hos geldin Alice, seni gordugume sevindim."
        Bob:
          greeting: "Selam Bob, bugun nasil hissediyorsun?"
      greet_cooldown_s: 30
    liveliness:
      heartbeat_interval_s: 30
      idle_lookaround_s: 60
  remote:
    auth_token: "changeme"
    accept_results: true
  robot:
    host: "localhost"
  ollama:
    endpoint: "@gateway/ollama/chat"
    model: "qwen3.5:9b"
    timeout: 8.0
    num_predict: 160
  llm:
    provider: "ollama"
    single_model_mode: true
    primary_model: "qwen3.5:9b"
    clm_fallback_enabled: false
    clm_fallback_model: ""
    fallback_on_missing_model: false
    fallback_on_error: false
  speak:
    endpoint: "http://localhost:8083/speak/say"
  translation:
    enabled: false
    endpoint: "@gateway/ollama/translate"
    source_lang: auto
    target_lang: tr
    timeout: 1.5
  actions:
    endpoint: "@gateway/autonomy/apply_actions"
    default_apply: true
    timeout: 1.5

speak:
  server:
    host: 0.0.0.0
    port: 8083
  audio_out:
    device: null
    samplerate: 22050
    channels: 1
    dtype: float32
  tts:
    engine: piper
    language: tr
    voice: source
    rate: 170
    volume: 1.0
    samplerate: 22050
    remote:
      enabled: false
      endpoint: http://192.168.1.100:5000/tts/synthesize
      timeout: 120
      auth_token: ""
    piper:
      bin_path: piper
      voice: tr
      auto_language: true
      prefer_text_language: false
      lock_session_language: true
      language_voices:
        tr: tr
        en: glados
      model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
      config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
      samplerate: 22050
      speaker: null
      length_scale: null
      noise_scale: null
      noise_w: null
      voices:
        tr:
          model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
          config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
        tr-fahrettin:
          model_path: data/piper_models/tr_TR-fahrettin-medium/tr_TR-fahrettin-medium.onnx
          config_path: data/piper_models/tr_TR-fahrettin-medium/tr_TR-fahrettin-medium.onnx.json
        tr-fettah:
          model_path: data/piper_models/tr_TR-fettah-medium/tr_TR-fettah-medium.onnx
          config_path: data/piper_models/tr_TR-fettah-medium/tr_TR-fettah-medium.onnx.json
        glados:
          model_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx
          config_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx.json
    xtts:
      endpoint: http://192.168.1.100:5000/tts/synthesize
      timeout: 120
      language: tr
      speaker_wav: null
  liveliness:
    enabled: true
    interactions_base_url: "@gateway/interactions"
    speech_effect:
      name: PULSE
      tone_effect_map:
        fast: COMET
        neutral: PULSE
        calm: BREATHE
        tired: THEATER_CHASE
      emphasis_effect_map:
        exclamation: COMET
        question: TWINKLE
      rhythm:
        enabled: true
        mode: clauses
        effect: PULSE
        words_per_beat: 3
        clauses_per_beat: 1
        max_beats: 4
        duration_ms: 150
        max_pause_marks: 4
        pause_effect_map:
          ",": TWINKLE
          ";": TWINKLE
          ":": BREATHE
          ".": BREATHE
      min_duration_ms: 400
      max_duration_ms: 7000
      chars_per_second: 16
      force: false

speech:
  server:
    host: 0.0.0.0
    port: 8082
  audio:
    device: null
    samplerate: 16000
    channels: 2
    dtype: int16
    frame_ms: 30
  recognition:
    source_language: tr
    language: tr
    default_language: tr
    auto_language: true
    auto_switch_model: true
    dual_decode_margin: 0.35
    utterance_buffer_sec: 20
    model_path: null
    language_models:
      tr: models/vosk-tr
      en: models/vosk-en
      en-us: models/vosk-en-us
      de: models/vosk-de
      es: models/vosk-es
      fr: models/vosk-fr
    samplerate: 16000
    max_alternatives: 0
    input_gain: 3.0
    vad:
      enabled: false
      aggressiveness: 2
      hangover_ms: 300
  direction:
    enabled: true
    mic_distance_m: 0.06
    control:
      invert_direction: false
      deadband_deg: 3.0
      smoothing_alpha: 0.3
      slew_deg_per_s: 120.0
      energy_threshold: 1000

actions:
  gateway_base_url: "http://127.0.0.1:8080"
  http_timeout_s: 2.5

tri_layer:
  enabled: true
  router:
    max_subagents: 3
    default_modules:
      - autonomy
      - agent_core
  subagent:
    max_steps: 4
  persona:
    num_predict: 384

realtime_profile:
  active: fast
  profiles:
    ultra_fast:
      num_predict_chat: 96
      num_predict_persona: 96
      max_subagents: 2
      subagent_max_steps: 2
      request_timeout_s: 28
      ollama_num_predict: 112
      speak_max_chunk_chars: 220
      vlm_ask_timeout_s: 10
      ollama_chat_timeout_s: 25
    fast:
      num_predict_chat: 192
      num_predict_persona: 192
      max_subagents: 2
      subagent_max_steps: 3
      request_timeout_s: 36
      ollama_num_predict: 176
      speak_max_chunk_chars: 260
      vlm_ask_timeout_s: 12
      ollama_chat_timeout_s: 25
    normal:
      num_predict_chat: 384
      num_predict_persona: 384
      max_subagents: 3
      subagent_max_steps: 4
      request_timeout_s: 48
      ollama_num_predict: 256
      speak_max_chunk_chars: 320
      vlm_ask_timeout_s: 16
      ollama_chat_timeout_s: 45
    thorough:
      num_predict_chat: 768
      num_predict_persona: 768
      max_subagents: 4
      subagent_max_steps: 6
      request_timeout_s: 70
      ollama_num_predict: 512
      speak_max_chunk_chars: 380
      vlm_ask_timeout_s: 22
      ollama_chat_timeout_s: 60

safety:
  max_servo_angle: 180
  min_servo_angle: 0
  max_stepper_speed: 100
  laser_max_duration_s: 2.0
