agent:
  auth_token: ""
  model: sentry:latest
  temperature: 0.15
  num_ctx: 8192
  cooldown_s: 0.1
  request_timeout: 30
  status_interval_s: 1.5
  waiting_messages:
  - Beklemedeyim...
  - Islem suruyor...
  - Hala isliyorum...
  ollama_base_url: http://whoismrsentry.local:11434
  max_steps: 4
llm:
  provider: ollama
  single_model_mode: false
  model: sentry:latest
  primary_model: sentry:latest
  allowed_models:
    - sentry:latest
    - glados:latest
    - nemotron-3.5-bolt:e4b
  clm_fallback_enabled: false
  clm_fallback_model: nemotron-3.5-bolt:e4b
  fallback_on_missing_model: false
  fallback_on_error: false
  think: true
  keep_alive: -1
models:
  roles:
    chat: sentry:latest
    companion: sentry:latest
    persona: sentry:latest
    followup: sentry:latest
    vision: nemotron-3.5-bolt:e4b
    vlm: nemotron-3.5-bolt:e4b
    scene_description: nemotron-3.5-bolt:e4b
    coder: nemotron-3.5-bolt:e4b
    developer: nemotron-3.5-bolt:e4b
    utility: nemotron-3.5-bolt:e4b
    planner: nemotron-3.5-bolt:e4b
    reflection: nemotron-3.5-bolt:e4b
    memory: nemotron-3.5-bolt:e4b
    translator: nemotron-3.5-bolt:e4b
    subagent: nemotron-3.5-bolt:e4b
ollama:
  base_url: http://whoismrsentry.local:11434
  model: sentry:latest
  request_timeout: 60
translation:
  enabled: true
  mode: online_first
  default_source_lang: tr
  bridge_lang: en
  local_models_dir: models/translate
  online_timeout_s: 2.5
  online_cooldown_s: 15.0
  local_threads: 2
  fallback_to_ollama: false
  cache_size: 256
runtime_profile:
  active: remote_ollama
  profiles:
    google_ai_studio:
      llm:
        provider: google_ai_studio
      agent:
        request_timeout: 45
      google_ai_studio:
        model: gemma-4-31b-it
        request_timeout: 45
      vlm_bridge:
        vision_llm:
          enabled: true
          provider: google_ai_studio
    remote_ollama:
      llm:
        provider: ollama
        single_model_mode: false
        use_persona_models: true
        model: sentry:latest
        primary_model: sentry:latest
        allowed_models:
          - sentry:latest
          - glados:latest
          - nemotron-3.5-bolt:e4b
      agent:
        model: sentry:latest
        ollama_base_url: http://whoismrsentry.local:11434
        request_timeout: 60
      ollama:
        base_url: http://whoismrsentry.local:11434
        model: sentry:latest
        request_timeout: 60
      vlm_bridge:
        vision_llm:
          enabled: true
          provider: ollama
          base_url: http://whoismrsentry.local:11434
          model: nemotron-3.5-bolt:e4b
          timeout_s: 18
        ollama:
          endpoint: '@gateway/ollama/chat'
          model: nemotron-3.5-bolt:e4b
          followup_model: sentry:latest
          timeout: 12.0
ollama_service:
  server:
    # Loopback by default. Set 0.0.0.0 or OLLAMA_SERVICE_HOST=0.0.0.0 for LAN access.
    host: 127.0.0.1
    port: 8099
  persona:
    default: sentry
    dir: modules/ai_provider/config/personalities
  actions:
    endpoint: '@gateway/autonomy/apply_actions'
    default_apply: true
    timeout: 1.5
  translation:
    enabled: false
    mode: ollama
    default_source_lang: tr
    model: nemotron-3.5-bolt:e4b
    cache_size: 128
  llm:
    provider: ollama
    single_model_mode: false
    use_persona_models: true
    model: sentry:latest
    primary_model: sentry:latest
    allowed_models:
      - sentry:latest
      - glados:latest
      - nemotron-3.5-bolt:e4b
    fallback_on_missing_model: false
    fallback_on_error: false
  ollama:
    base_url: http://whoismrsentry.local:11434
    model: sentry:latest
    request_timeout: 60
vlm_bridge:
  server:
    # Loopback by default. Set 0.0.0.0 or VLM_HOST=0.0.0.0 for LAN access.
    host: 127.0.0.1
    port: 8101
  vision:
    processing_mode: local
    hybrid_local_capture: true
    camera_source: '@gateway/camera/video'
    context_max_age_s: 45
    confidence_threshold: 0.5
    face_match:
      ratio_test: 0.78
      min_good_matches: 5
      min_score: 0.08
    follow:
      enabled: true
      track_interval_s: 0.12
      pan_gain_deg: 50
      tilt_gain_deg: 32
      center_pan: 90
      center_tilt: 90
      min_pan: 35
      max_pan: 145
      min_tilt: 65
      max_tilt: 125
      max_lost_frames: 18
    blind_mode:
      enabled: false
      interval_seconds: 5.0
    modes:
      objects: true
      people: true
      faces: true
      depth: false
      ocr: true
      hazards: true
      semantic_scene: true
    mode_categories:
      onsensor:
        tiny_detect: true
        tiny_pose: false
    alerts:
      classes:
      - person
      distance_threshold_m: 1.2
      announce_interval_s: 8.0
    personalization:
      known_people:
        Alice:
          greeting: Hos geldin Alice, seni gordugume sevindim.
        Bob:
          greeting: Selam Bob, bugun nasil hissediyorsun?
      greet_cooldown_s: 30
    liveliness:
      heartbeat_interval_s: 30
      idle_lookaround_s: 60
  remote:
    auth_token: ""
    accept_results: true
  remote_multimodal:
    enabled: true
    endpoint: http://192.168.1.100:8091/vision/analyze
    interval_s: 8.0
    jpeg_quality: 75
    auth_token: ''
    onsensor_hints:
      enabled: true
    task_split:
      enabled: true
      skip: [people, faces]
  robot:
    host: localhost
  ollama:
    endpoint: '@gateway/ollama/chat'
    model: nemotron-3.5-bolt:e4b
    followup_model: sentry:latest
    timeout: 12.0
    num_predict: 160
  llm:
    provider: ollama
    single_model_mode: false
    primary_model: nemotron-3.5-bolt:e4b
    allowed_models:
      - sentry:latest
      - nemotron-3.5-bolt:e4b
    clm_fallback_enabled: false
    clm_fallback_model: ''
    fallback_on_missing_model: false
    fallback_on_error: false
    model: nemotron-3.5-bolt:e4b

google_ai_studio:
  api_key: ''
  model: gemma-4-31b-it
  base_url: http://whoismrsentry.local:11434
  request_timeout: 30.0
  speak:
    endpoint: http://127.0.0.1:8080/speak/say
  translation:
    enabled: false
    endpoint: '@gateway/ollama/translate'
    source_lang: auto
    target_lang: tr
    timeout: 1.5
  actions:
    endpoint: '@gateway/autonomy/apply_actions'
    default_apply: true
    timeout: 1.5
  vision_llm:
    enabled: false
    provider: ollama
    base_url: http://whoismrsentry.local:11434
    model: nemotron-3.5-bolt:e4b
    timeout_s: 18
speak:
  server:
    host: 0.0.0.0
    port: 8080
  audio_out:
    device: null
    samplerate: 22050
    channels: 1
    dtype: float32
  tts:
    engine: piper
    allow_dummy_fallback: false
    language: tr
    voice: source
    rate: 170
    volume: 1.0
    samplerate: 22050
    remote:
      enabled: false
      endpoint: http://192.168.1.100:5000/tts/synthesize
      timeout: 120
      auth_token: ""
    piper:
      voice: tr
      auto_language: true
      prefer_text_language: true
      lock_session_language: false
      fallback_engine: ''
      language_voices:
        tr: tr
        en: glados
      model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
      config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
      samplerate: 22050
      speaker: null
      length_scale: null
      noise_scale: null
      noise_w: null
      voices:
        tr:
          model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
          config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
        tr-fahrettin:
          model_path: data/piper_models/tr_TR-fahrettin-medium/tr_TR-fahrettin-medium.onnx
          config_path: data/piper_models/tr_TR-fahrettin-medium/tr_TR-fahrettin-medium.onnx.json
        tr-fettah:
          model_path: data/piper_models/tr_TR-fettah-medium/tr_TR-fettah-medium.onnx
          config_path: data/piper_models/tr_TR-fettah-medium/tr_TR-fettah-medium.onnx.json
        glados:
          model_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx
          config_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx.json
      preload_voices:
      - tr
      - glados
    xtts:
      endpoint: http://192.168.1.100:5000/tts/synthesize
      timeout: 120
      language: tr
      speaker_wav: null
  liveliness:
    enabled: true
    expression_base_url: '@gateway/expression'
    event_timeout_s: 0.35
  lcd_sync:
    enabled: true
    cols: 20
    rows: 4
    overlay: true
    restore_on_finish: true
    restore_delay_s: 0.35
    min_page_sec: 0.75
    gateway_base_url: '@gateway'
    arduino_path: /arduino/send
    timeout_s: 0.25
    fail_cooldown_s: 10.0
    header: ''
  naturalness:
    enabled: false
# Ortak ses yakalama yolu — AudioRouter tek kanonik acilim (R18).
# Wakeword/speech bu bolumden cihaz/rate/kanal okur; "default" sistem varsayilanini kullanir.
audio_router:
  capture:
    device: default
    samplerate: 16000
    channels: 2
    frame_size: 1024
wakeword:
  audio:
    device: plughw:0,0
    samplerate: 16000
    channels: 2
    dtype: int16
    frame_ms: 30
    strict_device: true
  wakeword:
    engine: openwakeword
    words:
    - hey mycroft
    - mycroft
    trigger_on_partial: true
    min_confidence: 0.0
    cooldown_sec: 3.0
  openwakeword:
    pretrained_models:
    - hey_mycroft
    inference_framework: onnx
    threshold: 0.40
    smooth_window: 3
    input_gain: 3.0
    input_channels: 2
    vad_gate_enabled: true
    vad_min_rms: 75.0
    auto_calibration:
      enabled: true
      duration_sec: 4.0
      min_samples: 40
      percentile: 99.5
      margin: 0.0007
      min_threshold: 0.35
      max_threshold: 0.65
speech:
  listening: true
  server:
    host: 0.0.0.0
    port: 8080
  audio:
    device: plughw:0,0
    samplerate: 16000
    channels: 2
    dtype: int16
    frame_ms: 30
    strict_device: true
  recognition:
    source_language: tr
    language: tr
    default_language: tr
    auto_language: true
    auto_switch_model: true
    dual_decode_margin: 0.35
    dual_decode_languages:
    - tr
    - en
    utterance_buffer_sec: 20
    samplerate: 16000
    input_gain: 1.2
    silence_threshold: 130.0
    vad:
      enabled: false
      aggressiveness: 2
      hangover_ms: 300
  direction:
    enabled: true
    mic_distance_m: 0.06
    control:
      invert_direction: false
      deadband_deg: 3.0
      smoothing_alpha: 0.3
      slew_deg_per_s: 120.0
      energy_threshold: 1000
autonomy:
  auto_start: true
  start_on_gateway_boot: true

actions:
  gateway_base_url: http://127.0.0.1:8080
  http_timeout_s: 2.5
tri_layer:
  enabled: false
  api_native_tools: true
  laya:
    enabled: true
    confidence_threshold: 0.60
    model_path: null                      # null = auto-detect HF cache
    device: cpu
    fast_path:
      enabled: true                       # Direct command → skip LLM
      emergency_bypass_safety: false      # Legacy setting; no tool/action safety gate is bypassed
    action_proposals:
      enabled: false                      # Proposal only; never authorizes tool dispatch
      confidence_threshold: 0.85
      allowed_actions:
        - set_lights
      default_light_effect: BREATHE
    filler:
      enabled: true
      cooldown_s: 12.0
      mood_aware: true                    # Mood'a göre filler seçimi
    affective:
      mood_impact_scale: 1.0             # Laya → MoodManager etki katsayısı
      vision_events: true                 # VLM → Laya affective pipeline
      face_emotion_events: true           # Yüz duygusu → Laya
      vision_event_min_confidence: 0.80
      vision_event_min_affect_confidence: 0.80
      vision_event_cooldown_s: 8.0
      palettes:
        anger:
          anim_mild: "slow_breathe"
          anim_intense: "strobe"
          mild: ["#8B0000", "#A52A2A", "#B22222"]
          intense: ["#FF0000", "#FF1E00", "#DC143C"]
        disgust:
          anim_mild: "flicker"
          anim_intense: "flicker"
          mild: ["#556B2F", "#6B8E23", "#4A5D23"]
          intense: ["#808000", "#7FFF00", "#2E8B57"]
        joy:
          anim_mild: "breathe"
          anim_intense: "pulse"
          mild: ["#00FF88", "#20B2AA", "#3CB371"]
          intense: ["#00FFCC", "#39FF14", "#FFD700"]
        fear:
          anim_mild: "slow_fade"
          anim_intense: "rapid_flash"
          mild: ["#483D8B", "#4B0082"]
          intense: ["#FF1493", "#FF0033"]
        curiosity:
          anim_mild: "static"
          anim_intense: "sweep"
          mild: ["#4682B4", "#5F9EA0"]
          intense: ["#00D4FF", "#00FFFF"]
        sadness:
          anim_mild: "slow_breathe"
          anim_intense: "slow_fade"
          mild: ["#1E3A8A", "#2563EB"]
          intense: ["#1D4ED8", "#1E40AF"]
        neutral:
          anim_mild: "static"
          anim_intense: "breathe"
          mild: ["#00D4FF", "#4060FF"]
          intense: ["#00D4FF", "#4060FF"]
    telemetry:
      log_decisions: true
      histogram_enabled: false
      max_decision_log: 20
    urgency:
      emergency_threshold: 2.0           # Bu üstü → SpinalCord tetikle
      high_threshold: 1.5                # Bu üstü → fast-path
      high_confidence_threshold: 0.60
      emergency_target_confidence_threshold: 0.90
      emergency_direct_confidence_threshold: 0.80
      emergency_urgency_confidence_threshold: 0.80
      sensor_boost_hz: 5.0               # Urgency high → sensor poll rate
      sensor_boost_hold_s: 8.0            # High urgency polling window after the decision
  system1:
    backend: cascade                     # cascade = rules → embed → laya | laya = sadece Laya | off = devre dışı
    enabled: true
    rules:
      enabled: true                      # <1ms keyword/rule katmanı
    embed:
      enabled: true                      # e5-small kNN (~50-100ms); model yoksa otomatik atlanır
      model_path: models/e5-small-onnx
      threshold_module: 0.55
      threshold_direct: 0.80
  fast_path:
    enabled: true
    max_chars: 180
    num_predict: 2048
    max_steps: 2
  router:
    max_subagents: 3
    default_modules:
    - autonomy
    - agent_core
  subagent:
    max_steps: 4
  persona:
    num_predict: 4096
    stream: true
realtime_profile:
  active: fast
  profiles:
    ultra_fast:
      num_predict_chat: 1024
      num_predict_persona: 1024
      max_subagents: 2
      subagent_max_steps: 2
      request_timeout_s: 28
      ollama_num_predict: 1024
      speak_max_chunk_chars: 220
      vlm_ask_timeout_s: 10
      ollama_chat_timeout_s: 25
    fast:
      num_predict_chat: 2048
      num_predict_persona: 2048
      max_subagents: 2
      subagent_max_steps: 3
      request_timeout_s: 36
      ollama_num_predict: 2048
      speak_max_chunk_chars: 260
      vlm_ask_timeout_s: 12
      ollama_chat_timeout_s: 25
    normal:
      num_predict_chat: 4096
      num_predict_persona: 4096
      max_subagents: 3
      subagent_max_steps: 4
      request_timeout_s: 48
      ollama_num_predict: 4096
      speak_max_chunk_chars: 320
      vlm_ask_timeout_s: 16
      ollama_chat_timeout_s: 45
    thorough:
      num_predict_chat: 4096
      num_predict_persona: 4096
      max_subagents: 4
      subagent_max_steps: 6
      request_timeout_s: 70
      ollama_num_predict: 512
      speak_max_chunk_chars: 380
      vlm_ask_timeout_s: 22
      ollama_chat_timeout_s: 60
safety:
  max_servo_angle: 180
  min_servo_angle: 0
  max_stepper_speed: 100
  laser_max_duration_s: 2.0
camera:
  enabled: true
  backend: picamera2
  resolution:
    width: 1280
    height: 720
  fps_target: 30
  jpeg_quality: 80
  flip: none
  picamera2:
    size:
      width: 1280
      height: 720
    format: RGB888
    frame_rate: 30
  imx500:
    enabled: true
    model_path: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
    labels_path: ''
    confidence: 0.5
    iou: 0.65
    max_detections: 20
    publish_interval_s: 0.05
    inference_rate: 30
    preserve_aspect_ratio: true
    tracker:
      iou_threshold: 0.3
      max_missed: 8
    target:
      label: person
      strategy: largest
    classes_of_interest:
    - person
    - cat
    - dog
    - chair
    - bottle
    - cup
    - book
    - laptop
    - cell phone
    - tv
provider_truth:
  active_provider: ollama
  runtime_profile: remote_ollama
  reason: raspberry_pi_runtime_with_configured_ollama_provider
  llm_model: sentry:latest
  vlm_model: nemotron-3.5-bolt:e4b
  coder_model: nemotron-3.5-bolt:e4b
  utility_model: nemotron-3.5-bolt:e4b
  ollama_base_url: http://whoismrsentry.local:11434
  vlm_provider: ollama
  remote_multimodal_url: ''
  updated_by: 37_ssh_tunnel_ollama_profile.ps1
environment:
  SENTRYBOT_REMOTE_OLLAMA_URL: http://whoismrsentry.local:11434
  SENTRYBOT_OLLAMA_BASE_URL: http://whoismrsentry.local:11434

startup:
  preflight:
    enabled: true
    require_raspberry_pi: true
    require_i2s_input: true
    required_python_modules: [yaml, fastapi, uvicorn, sounddevice]
    required_commands: [arecord]
  bluetooth:
    bluetoothctl_command: bluetoothctl
    pactl_command: pactl
    command_timeout_s: 20
