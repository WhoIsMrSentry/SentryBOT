agent:
  model: "gemma4:26b"
  temperature: 0.15
  num_ctx: 4096
  cooldown_s: 1.0  # LLM Rate Limit
  request_timeout: 60
  ollama_base_url: "http://localhost:11434"
  max_steps: 6

llm:
  provider: "ollama"
  clm_fallback_enabled: true
  clm_fallback_model: "qwen3.5:8b"
  fallback_on_missing_model: true
  fallback_on_error: true

tri_layer:
  enabled: true
  router:
    max_subagents: 3
    default_modules:
      - vlm_bridge
      - autonomy
      - agent_core
  subagent:
    max_steps: 2
  persona:
    num_predict: 220
  
safety:
  max_servo_angle: 180
  min_servo_angle: 0
  max_stepper_speed: 100
  laser_max_duration_s: 2.0
