name: Deploy Graph UI

on:
  push:
    branches: [main]
    paths:
      - ".codebase-memory/graph.db.zst"
      - "tools/graph-ui/**"
      - ".github/workflows/deploy-graph-ui.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/graph-ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install zstd
        run: sudo apt-get update -q && sudo apt-get install -y -q zstd

      - name: Export graph data
        run: python3 scripts/export-graph-data.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/graph-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /SentryBOT/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/graph-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
