name: tests
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/remote_multimodal_server/requirements.txt
      - name: Core test suite
        run: |
          python -m pytest tests -q --no-header --ignore=tests/modules/runtime_console \
            --ignore=tests/modules/runtime_contracts --ignore=tests/test_sentrybot_launcher.py
      - name: Remote multimodal service tests
        run: |
          python -m pytest services/remote_multimodal_server/tests -q --no-header
