# Auto-label PRs by changed paths (modules/*)
# Labels are defined in .github/labels.yml and applied here.

"module: animate":
  - changed-files:
      - any-glob-to-any-file: modules/animate/**
  - head-branch: [".*animate.*"]
"module: arduino_serial":
  - changed-files:
      - any-glob-to-any-file: modules/arduino_serial/**
  - head-branch: [".*arduino[_-]?serial.*"]
"module: arduino":
  - changed-files:
      - any-glob-to-any-file: arduino/**
  - head-branch: [".*arduino.*"]
"module: arduino/firmware":
  - changed-files:
      - any-glob-to-any-file: arduino/firmware/**
  - head-branch: [".*arduino[_/-]?firmware.*"]
"module: arduino/firmware/xMain":
  - changed-files:
      - any-glob-to-any-file: arduino/firmware/xMain/**
  - head-branch: [".*xMain.*"]
"module: arduino/ir":
  - changed-files:
      - any-glob-to-any-file: arduino/**/ir*/**
      - any-glob-to-any-file: arduino/**/*ir*.*
  - head-branch: [".*\bir\b.*", ".*irmenu.*"]
"module: arduino/imu":
  - changed-files:
      - any-glob-to-any-file: arduino/**/imu/**
      - any-glob-to-any-file: arduino/**/*imu*.*
  - head-branch: [".*imu.*"]
"module: arduino/tools":
  - changed-files:
      - any-glob-to-any-file: arduino/tools/**
  - head-branch: [".*arduino[_/-]?tools.*"]

