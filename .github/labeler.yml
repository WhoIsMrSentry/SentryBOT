# Label PRs targeting dev branch
"target: dev":
  - base-branch: ["^dev$"]

# Label feature PRs by branch name prefix (e.g., feat-...)
"type: feature":
  - head-branch: ["^feat[-/].*", "^feature[-/].*"]

