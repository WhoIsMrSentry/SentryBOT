server:
  host: 0.0.0.0
  port: 8099

vision:
  processing_mode: local  # local | remote
  # camera_source: "http://localhost:8000/video_feed" # Potential future: pull from camera module HTTP
  camera_source: 0  # Local webcam when in local mode
  confidence_threshold: 0.5
  face_match:
    ratio_test: 0.72
    min_good_matches: 10
    min_score: 0.15
  follow:
    enabled: true
    track_interval_s: 0.12
    pan_gain_deg: 50
    tilt_gain_deg: 32
    center_pan: 90
    center_tilt: 90
    min_pan: 35
    max_pan: 145
    min_tilt: 65
    max_tilt: 125
    max_lost_frames: 18
  blind_mode:
    enabled: false
    interval_seconds: 5.0
  modes:
    objects: true      # localde YOLO yok; nesne listesi remote /vlm/results ile gelebilir
    people: true
    faces: true
    depth: false        # remote heavy model (e.g. MiDaS) için
    ocr: false          # metin okuma
    hazards: true       # tehlike algılama
    semantic_scene: true
  alerts:
    classes: ["person"]
    distance_threshold_m: 1.2
    announce_interval_s: 8.0
  personalization:
    known_people:
      Alice:
        greeting: "Hoş geldin Alice, seni gördüğüme sevindim."
      Bob:
        greeting: "Selam Bob, bugün nasıl hissediyorsun?"
    greet_cooldown_s: 30
  liveliness:
    heartbeat_interval_s: 30
    idle_lookaround_s: 60

remote:
  auth_token: "changeme"  # Set a secure token in production or override
  accept_results: true     # Allow POST /vlm/results ingestion

robot:
  host: "localhost"  # Change to Robot IP when running remotely

ollama:
  endpoint: "http://localhost:11435/api/generate"
  model: "llama3"

speak:
  endpoint: "http://localhost:8083/speak/say"
translation:
  enabled: false
  endpoint: "http://localhost:8080/ollama/translate"
  source_lang: auto
  target_lang: tr
  timeout: 1.5
actions:
  endpoint: "http://localhost:8100/autonomy/apply_actions"
  default_apply: true
  timeout: 1.5
