server:
  # Loopback by default. Set host: 0.0.0.0 or OLLAMA_SERVICE_HOST=0.0.0.0 for LAN access.
  host: 127.0.0.1
  port: 8099
llm:
  provider: ollama   # ollama | google_ai_studio
  single_model_mode: false     # Role-based local multi-model routing
  use_persona_models: false    # Disable legacy persona model injection
  allowed_models:
    - sentry:latest
    - qwen3.5:9b
    - nemotron-3.5-bolt:e4b
    - qwen2.5-coder:7b
ollama:
  base_url: http://whoismrsentry.local:11434
  model: sentry:latest
  request_timeout: 45
  num_predict: 4096        # Uzun yanıtları kesmeden üretmek için üst sınır
google_ai_studio:
  api_key: ''
  model: gemini-2.5-flash
  base_url: http://whoismrsentry.local:11434
  request_timeout: 20
persona:
  default: sentry
  dir: modules/ai_provider/config/personalities
actions:
  endpoint: '@gateway/autonomy/apply_actions'
  default_apply: true
  timeout: 1.5
translation:
  enabled: false
  default_source_lang: tr
  model: nemotron-3.5-bolt:e4b
  cache_size: 128
