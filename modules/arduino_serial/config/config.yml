# Arduino Serial Module config (NDJSON @115200)
port: /dev/serial0   # default to Raspberry Pi UART; set to AUTO to autodetect or COMx on Windows
baudrate: 115200
timeout: 0.05
write_timeout: 0.1
reconnect_sec: 2.0
heartbeat_ms: 100
auto_heartbeat: true
# Request/retry tuning (milliseconds for timeouts where noted)
request_max_retries: 0    # number of additional retries after first attempt
request_timeout_ms: 1000 # default timeout for requests (ms) if not provided
telemetry:
  enabled: false
  interval_ms: 100
  endpoint: null  # optional HTTP endpoint to POST telemetry events, e.g. http://localhost:8090/telemetry/events
log_level: INFO
rfid:
  allowed_uids: []
  authorize_window_s: 8
