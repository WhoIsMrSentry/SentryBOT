server:
  host: 0.0.0.0
  port: 8083
audio_out:
  device: null
  samplerate: 22050
  channels: 1
  dtype: float32
tts:
  engine: piper
  allow_dummy_fallback: false
  language: tr
  rate: 170
  volume: 1.0
  samplerate: 22050
  stream_max_chunk_chars: 180
  pcm_cache_max_entries: 24
  remote:
    enabled: false
    endpoint: http://192.168.1.100:5000/tts/synthesize
    timeout: 120
    auth_token: ''
  piper:
    voice: tr
    auto_language: true
    prefer_text_language: true
    lock_session_language: false
    fallback_engine: ''
    model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
    config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
    language_voices:
      tr: tr
      en: glados
    preload_voices:
      - tr
      - glados
    voices:
      tr:
        model_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx
        config_path: data/piper_models/tr_TR-dfki-medium/tr_TR-dfki-medium.onnx.json
      glados:
        model_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx
        config_path: data/piper_models/en-glados-medium/glados_piper_medium.onnx.json
  xtts:
    endpoint: http://192.168.1.100:5000/tts/synthesize
    timeout: 120
    language: tr
    speaker_wav: null
liveliness:
  enabled: true
  expression_base_url: '@gateway/expression'
  event_timeout_s: 0.35
lcd_sync:
  enabled: true
  cols: 20
  rows: 4
  overlay: true
  restore_on_finish: true
  restore_delay_s: 0.35
  min_page_sec: 0.75
  gateway_base_url: '@gateway'
  arduino_path: /arduino/send
  timeout_s: 0.25
  fail_cooldown_s: 10.0
  header: ''
naturalness:
  enabled: false
