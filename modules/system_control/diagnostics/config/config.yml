server:
  host: 0.0.0.0
  port: 8098

gateway_port: 8080

checks:
  camera:
    enabled: true
    method: GET
    path: /camera/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: false
    heal:
      method: POST
      path: /camera/start
      timeout_s: 1.2
  arduino:
    enabled: true
    method: GET
    path: /arduino/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: true
  neopixel:
    enabled: true
    method: GET
    path: /neopixel/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: false
  speech:
    enabled: true
    method: GET
    path: /speech/status
    timeout_ms: 900
    latency_warn_ms: 500
    critical: true
    heal:
      method: POST
      path: /speech/start
      timeout_s: 1.2
  speak:
    enabled: true
    method: GET
    path: /speak/status
    timeout_ms: 900
    latency_warn_ms: 500
    critical: true
  wakeword:
    enabled: true
    method: GET
    path: /wakeword/status
    timeout_ms: 900
    latency_warn_ms: 500
    critical: false
  oled_faces:
    enabled: true
    method: GET
    path: /oled_faces/healthz
    timeout_ms: 900
    latency_warn_ms: 500
    critical: false
  agent_core:
    enabled: true
    method: GET
    path: /agent/healthz
    timeout_ms: 900
    latency_warn_ms: 500
    critical: false
  autonomy:
    enabled: true
    method: GET
    path: /autonomy/state
    timeout_ms: 900
    latency_warn_ms: 500
    critical: false

thresholds:
  default_timeout_ms: 1000
  default_latency_warn_ms: 600

self_heal:
  enabled: true
  hard_heal_cooldown_s: 60.0

system_checks:
  enabled: true
  disk_path: "."
  min_free_gb: 0.5
  min_free_mb: 100.0

notify:
  enabled: false
  endpoint: /notify/telegram
