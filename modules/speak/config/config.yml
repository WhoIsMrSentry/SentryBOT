# Speak (TTS) module configuration

server:
  host: 0.0.0.0
  port: 8083

audio_out:
  device: null          # ALSA device (e.g., sysdefault, hw:1,0). For MAX98357A via I2S set the correct ALSA card.
  samplerate: 22050
  channels: 1           # MAX98357A is mono; driver may expose stereo. Upmix handled in code.
  dtype: float32

tts:
  engine: piper      # pyttsx3 | piper | xtts | dummy
  language: tr
  voice: source         # optional voice id — default olarak kaynak sesi kullanılacak
  rate: 170
  volume: 1.0
  samplerate: 22050
  # Piper ayarları
  piper:
    bin_path: /home/sentrybot/SentryBOT/venv/bin/piper  # Raspberry Pi venv piper binary
    model_path: /home/sentrybot/models/tr_TR-dfki-medium.onnx  # sentrybot kullanıcısı için model yolu
    config_path: /home/sentrybot/models/tr_TR-dfki-medium.onnx.json
    samplerate: 22050
    speaker: null             # model çoklu speaker destekliyorsa id
    length_scale: null
    noise_scale: null
    noise_w: null

  # XTTS ayarları (ayrı env'de çalışan local HTTP servis)
  # Örn: PC üzerindeki server_app TTS proxy: http://PC_IP:5000/tts/synthesize
  xtts:
    endpoint: http://192.168.1.100:5000/tts/synthesize
    timeout: 120
    language: tr
    speaker_wav: null          # ses kopyalama için referans wav yolu (opsiyonel)

liveliness:
  enabled: true
  interactions_base_url: http://localhost:8080/interactions
  speech_effect:
    name: PULSE
    tone_effect_map:
      fast: COMET
      neutral: PULSE
      calm: BREATHE
      tired: THEATER_CHASE
    emphasis_effect_map:
      exclamation: COMET
      question: TWINKLE
    rhythm:
      enabled: true
      mode: clauses           # words | clauses
      effect: PULSE
      words_per_beat: 3
      clauses_per_beat: 1
      max_beats: 4
      duration_ms: 150
      max_pause_marks: 4
      pause_effect_map:
        ",": TWINKLE
        ";": TWINKLE
        ":": BREATHE
        ".": BREATHE
    min_duration_ms: 400
    max_duration_ms: 7000
    chars_per_second: 16
    force: false

# note: external compressed audio decoding removed; /speak/play expects base64 WAV
