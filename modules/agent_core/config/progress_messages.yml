# Progress TTS mesaj kataloğu — çok dilli.
# progress.py bu dosyayı yükler; oturum dili katalogda yoksa default_language kullanılır.
# Yeni dil eklemek için languages altına yeni bir blok eklemek yeterlidir (kod değişikliği gerekmez).
# name: LLM dil direktifinde kullanılan İngilizce dil adı.

default_language: en

languages:
