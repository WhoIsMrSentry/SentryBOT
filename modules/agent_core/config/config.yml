safety:
  max_servo_angle: 180
  min_servo_angle: 0
  max_stepper_speed: 100
  laser_max_duration_s: 2.0
sensor_loop:
  poll_hz: 2.0
  enabled: true
  hardware_interval_s: 2.0
  vision_results_interval_s: 5.0
  visual_context_interval_s: 10.0
  skip_hardware_on_pc: true
action_arbiter:
  default_cooldown_s: 0.5
  dedup_window_s: 2.0
speech_arbiter:
  max_queue_size: 10
  dedup_window_s: 5.0
progress:
  enabled: true
  persona_start_min_elapsed_s: 4.0
tool_execution:
  timeout_s: 22.0
  retry_on_timeout: true
  max_retries: 1
idle:
  enabled: true
  breathe_interval_s: 15.0
memory:
  db_name: memory.db
  consolidation:
    enabled: true
    fact_importance: 8
slam:
  map_file: map.json
realtime_profile:
  active: fast
  fast:
    num_predict_chat: 100
    num_predict_persona: 120
    num_predict_vlm: 256
    num_predict_vlm_bridge: 100
    num_ctx: 3072
    temperature: 0.1
    request_timeout_s: 15
    ollama_chat_timeout_s: 12
    vlm_ask_timeout_s: 14
    max_subagents: 1
    subagent_workers: 1
    subagent_max_steps: 2
  normal:
    num_predict_chat: 180
    num_predict_persona: 180
    num_predict_vlm: 384
    num_predict_vlm_bridge: 160
    num_ctx: 4096
    temperature: 0.15
    request_timeout_s: 25
    ollama_chat_timeout_s: 20
    vlm_ask_timeout_s: 20
    max_subagents: 2
    subagent_workers: 2
    subagent_max_steps: 3
  rich:
    num_predict_chat: 240
    num_predict_persona: 260
    num_predict_vlm: 512
    num_predict_vlm_bridge: 220
    num_ctx: 6144
    temperature: 0.2
    request_timeout_s: 35
    ollama_chat_timeout_s: 28
    vlm_ask_timeout_s: 24
    max_subagents: 4
    subagent_workers: 3
    subagent_max_steps: 4

expression_lease:
  priorities:
    default: 10
    ambient_idle: 10
    autonomy: 20
    interactions: 40
    animate: 50
    vlm: 60
    semantic: 60
    owner_command: 80
    safety_navigation: 90
    hardware_protection: 90
    emergency: 100
  force_sources: [hardware_protection, emergency]
  channels:
    lights: { default_lease_s: 2.5 }
    oled: { default_lease_s: 2.5 }
