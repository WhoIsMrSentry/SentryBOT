server:
  host: 0.0.0.0
  port: 8120
agent:
  model: sentry:latest
  temperature: 0.15
  num_ctx: 8192
  num_predict: 4096
  cooldown_s: 0.1
  request_timeout: 30
  status_interval_s: 1.0
  waiting_messages:
  - Beklemedeyim...
  - Islem suruyor...
  - Hala isliyorum...
  ollama_base_url: http://whoismrsentry.local:11434
  max_steps: 4
  max_tool_loops: 3
translation:
  enabled: true
  mode: online_first
  default_source_lang: tr
  bridge_lang: en
  local_models_dir: models/translate
  online_timeout_s: 2.5
  online_cooldown_s: 15.0
  local_threads: 2
  fallback_to_ollama: false
  cache_size: 256
llm:
  provider: ollama
  single_model_mode: false
  model: sentry:latest
  primary_model: sentry:latest
  allowed_models:
  - sentry:latest
  - glados:latest
  - nemotron-3.5-bolt:e4b
  clm_fallback_enabled: false
  clm_fallback_model: nemotron-3.5-bolt:e4b
  fallback_on_missing_model: false
  fallback_on_error: false
  think: true
  keep_alive: -1
models:
  roles:
    chat: sentry:latest
    companion: sentry:latest
    persona: sentry:latest
    followup: sentry:latest
    vision: nemotron-3.5-bolt:e4b
    vlm: nemotron-3.5-bolt:e4b
    scene_description: nemotron-3.5-bolt:e4b
    coder: nemotron-3.5-bolt:e4b
    developer: nemotron-3.5-bolt:e4b
    utility: nemotron-3.5-bolt:e4b
    planner: nemotron-3.5-bolt:e4b
    reflection: nemotron-3.5-bolt:e4b
    memory: nemotron-3.5-bolt:e4b
    translator: nemotron-3.5-bolt:e4b
    subagent: nemotron-3.5-bolt:e4b
tri_layer:
  enabled: false
  api_native_tools: true
  fast_path:
    enabled: true
    max_chars: 180
    num_predict: 2048
    max_steps: 2
  router:
    max_subagents: 2
    default_modules:
    - autonomy
    - agent_core
  subagent:
    max_steps: 2
  persona:
    num_predict: 4096
    stream: true
    system_prompt: ""
safety:
  max_servo_angle: 180
  min_servo_angle: 0
  max_stepper_speed: 100
  laser_max_duration_s: 2.0
sensor_loop:
  poll_hz: 2.0
  enabled: true
  hardware_interval_s: 2.0
  vision_results_interval_s: 5.0
  visual_context_interval_s: 10.0
  skip_hardware_on_pc: true
action_arbiter:
  default_cooldown_s: 0.5
  dedup_window_s: 2.0
speech_arbiter:
  max_queue_size: 10
  dedup_window_s: 5.0
progress:
  enabled: true
  persona_start_min_elapsed_s: 4.0
tool_execution:
  timeout_s: 22.0
  retry_on_timeout: true
  max_retries: 1
agent_runtime:
  enabled: true
  max_iterations: 6
  max_tool_calls: 8
  max_retries: 2
  max_replans: 2
  max_execution_time_s: 60.0
  max_identical_actions: 3
  max_zero_progress: 3
  decision_trace_maxlen: 64
  decision_trace_log_path: ""
  decision_trace_log_max_bytes: 262144
  decision_trace_log_backups: 2
  contextual_replan:
    enabled: true
    llm_assist: false
    max_candidate_steps: 4
    fallback_observe_wait: true
    risk_ceiling: medium
    blocked_risks: [critical]
  goal_persistence:
    enabled: true
    backend: memory
    ttl_s: 600
    resume_on_tick: true
idle:
  enabled: true
  breathe_interval_s: 15.0
memory:
  db_name: memory.db
  consolidation:
    enabled: true
    fact_importance: 8
slam:
  map_file: map.json
realtime_profile:
  active: fast
  fast:
    num_predict_chat: 2048
    num_predict_persona: 2048
    num_predict_vlm: 512
    num_predict_vlm_bridge: 256
    num_ctx: 8192
    temperature: 0.1
    request_timeout_s: 15
    ollama_chat_timeout_s: 12
    vlm_ask_timeout_s: 14
    max_subagents: 1
    subagent_workers: 1
    subagent_max_steps: 2
  normal:
    num_predict_chat: 4096
    num_predict_persona: 4096
    num_predict_vlm: 512
    num_predict_vlm_bridge: 256
    num_ctx: 8192
    temperature: 0.15
    request_timeout_s: 25
    ollama_chat_timeout_s: 20
    vlm_ask_timeout_s: 20
    max_subagents: 2
    subagent_workers: 2
    subagent_max_steps: 3
  rich:
    num_predict_chat: 4096
    num_predict_persona: 4096
    num_predict_vlm: 512
    num_predict_vlm_bridge: 220
    num_ctx: 8192
    temperature: 0.2
    request_timeout_s: 35
    ollama_chat_timeout_s: 28
    vlm_ask_timeout_s: 24
    max_subagents: 4
    subagent_workers: 3
    subagent_max_steps: 4

expression_lease:
  priorities:
    default: 10
    ambient_idle: 10
    autonomy: 20
    interactions: 40
    animate: 50
    vlm: 60
    semantic: 60
    owner_command: 80
    safety_navigation: 90
    hardware_protection: 90
    emergency: 100
  force_sources: [hardware_protection, emergency]
  channels:
    lights: { default_lease_s: 2.5 }
    oled: { default_lease_s: 2.5 }
