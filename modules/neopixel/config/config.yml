server:
  host: 0.0.0.0
  port: 8092

hardware:
  # backend: auto | pi | arduino | sim
  backend: pi
  device: "/dev/spidev0.0"
  num_leds: 23
  segments:
    - { name: jewel, start: 0, count: 7 }
    - { name: stick_left, start: 7, count: 8 }
    - { name: stick_right, start: 15, count: 8 }
  speed_khz: 800
  ws2812_spi_khz: 2400
  order: "GRB"

companion:
  enabled: true
  tick_ms: 25
  layout:
    jewel_start: 0
    jewel_count: 7
    jewel_center_index: 6
    sticks:
      - { start: 7, count: 8, channel: 0 }
      - { start: 15, count: 8, channel: 1 }
  colors:
    thinking: "#0066CC"
    eye_default: "#30E3CA"
    wake_spin: "#FFD700"
    vu_bar: "#00AAFF"
    vu_bg: "#051018"
    # VU gradient: green (quiet) -> yellow (mid) -> red (loud)
    vu_gradient:
      - "#00FF00"
      - "#FFFF00"
      - "#FF0000"
  thinking:
    step_ms: 120
  eye:
    breathe_ms: 800
  vu:
    attack: 0.78
    decay: 0.22
    min_level: 0.02
    stale_ms: 180
  wake_spin:
    duration_ms: 1200
    wait_ms: 45
    next_mode: listen_vu

# Pi5-specific driver hint
pi5neo:
  enabled: true
  spi_device: "/dev/spidev0.0"
  spi_khz: 2400
  speed_khz: 800

defaults:
  rainbow:
    wait: 0.02
    cycles: 3
  theater_chase:
    r: 255
    g: 0
    b: 0
    wait: 0.05
    cycles: 10

presets:
  owner_welcome:
    jewel: { effect: "PULSE", color: "#00AAFF" }
    stick: { color: "#104070" }
  calm_idle:
    jewel: { color: "#2A6A8A" }
    stick: { color: "#102030" }
  curious_scan:
    jewel: { effect: "TWINKLE", color: "#30E3CA" }
    stick: { color: "#103838" }
