server:
  host: 0.0.0.0
  port: 8098

gateway_port: 8080

checks:
  camera:
    enabled: true
    method: GET
    path: /camera/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: false
    heal:
      method: POST
      path: /camera/start
      timeout_s: 1.2
  arduino:
    enabled: true
    method: GET
    path: /arduino/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: true
  neopixel:
    enabled: true
    method: GET
    path: /neopixel/healthz
    timeout_ms: 900
    latency_warn_ms: 450
    critical: false
  speech:
    enabled: true
    method: GET
    path: /speech/status
    timeout_ms: 900
    latency_warn_ms: 500
    critical: true
    heal:
      method: POST
      path: /speech/start
      timeout_s: 1.2
  speak:
    enabled: true
    method: GET
    path: /speak/status
    timeout_ms: 900
    latency_warn_ms: 500
    critical: true

thresholds:
  default_timeout_ms: 1000
  default_latency_warn_ms: 600

self_heal:
  enabled: false

notify:
  enabled: false
  endpoint: /notify/test
