enabled: true
backend: picamera2
resolution:
  width: 1280
  height: 720
fps_target: 30
jpeg_quality: 80
flip: none
picamera2:
  size:
    width: 1280
    height: 720
  format: RGB888
  frame_rate: 30
imx500:
  enabled: true
  model_path: "/usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk"
  labels_path: ""
  confidence: 0.50
  iou: 0.65
  max_detections: 20
  publish_interval_s: 0.05
  inference_rate: 30
  preserve_aspect_ratio: true
  tracker:
    iou_threshold: 0.30
    max_missed: 8
  target:
    label: person
    strategy: largest
  classes_of_interest:
    - person
    - cat
    - dog
    - chair
    - bottle
    - cup
    - book
    - laptop
    - cell phone
    - tv
server:
  host: 0.0.0.0
  port: 8000
logging:
  level: INFO
