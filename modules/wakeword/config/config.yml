server:
  host: 0.0.0.0
  port: 8084

audio:
  device: plughw:0,0
  samplerate: 16000
  channels: 2
  dtype: int16
  frame_ms: 30

recognition:
  language: tr
  # point to speech module's model to reuse existing download
  model_path: ../speech/models/vosk-tr
  language_models:
    tr: models/vosk-tr
    en: models/vosk-en
    en-us: models/vosk-en-us
  samplerate: 16000
  max_alternatives: 0
  vad:
    enabled: true
    aggressiveness: 2
    hangover_ms: 300

wakeword:
  engine: "openwakeword"  # openwakeword | vosk
  words:
    - "hey sentry"
    - "sentry"
  trigger_on_partial: true
  min_confidence: 0.0
  cooldown_sec: 3.0

openwakeword:
  # model_paths can be a list or a map: {label: path}
  model_paths:
    - models/hey_sentribot.onnx
  inference_framework: onnx
  threshold: 0.5
  smooth_window: 3
  verifier_path: null  # optional path to verifier joblib trained with train_verifier.py

actions:
  speech_start_url: "http://localhost:8080/speech/start"
  speech_stop_url: "http://localhost:8080/speech/stop"
  speech_last_url: "http://localhost:8080/speech/last"
  interactions_event_url: "http://localhost:8080/interactions/event"
  listen_window_sec: 8.0
  stop_on_final: true
  poll_interval_ms: 200
