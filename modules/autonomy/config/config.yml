speech:
  use_stream_tts: true
  stream_poll_interval_s: 0.12
  stream_max_wait_s: 90
  stream_max_chunk_chars: 220
  learning:
    enabled: true
    feedback:
      enabled: true
      trust_min: 0.0
      trust_max: 1.0
      deltas:
        user_praise:
          trust: 0.08
          salience: 0.5
        user_rude:
          trust: -0.12
          salience: 0.55
sound_direction:
  poll_interval_s: 2.0
vision_hooks:
  enabled: true
  poll_interval_s: 5
  forward_interval_s: 8
  max_results: 5
  person_cooldown_s: 25
  ignore_labels:
  - chair
  - tv
  prefer_llm_greetings: true
  speak_on_unknown: false
  importance_speak_threshold: 0.6
  focus:
    jitter_min: -3
    jitter_max: 3
    deadband_deg: 2
    smoothing: 0.55
  dynamic_cooldown:
    enabled: true
    near_distance_m: 1.2
    far_distance_m: 3.0
    near_multiplier: 0.6
    far_multiplier: 1.3
  empathy:
    enabled: true
    cooldown_s: 28
    mirror:
    - joy
    - sadness
    - fear
    - worried
    speak_on_mirror: true
empathy:
  enabled: true
  cooldown_s: 28
