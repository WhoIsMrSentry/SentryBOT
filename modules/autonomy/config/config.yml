runtime:
  auto_start: true
  start_on_gateway_boot: true

defaults:
  loop_interval_ms: 500
  boredom_threshold_s: 20
  alone_threshold_s: 120
  mood:
    decay_rate: 0.5
    anger_threshold: 38
    furious_threshold: 75
    initial_happiness: 50
    initial_energy: 100
    max_happiness: 100
    max_energy: 100
    needs:
      social:
        initial: 50
        decay_per_s: 0.08
        interaction_fill: 18
      stimulation:
        initial: 40
        growth_per_s: 0.12
        interaction_drain: 12
      rest:
        initial: 80
        drain_per_s: 0.06
        sleep_fill: 35
  body_language:
    profiles:
      joy:
        pan_delta: 6
        tilt_delta: 4
        event: autonomy.joy
      curiosity:
        pan_delta: 8
        tilt_delta: 3
        event: autonomy.curious
      fear:
        pan_delta: 10
        tilt_delta: 6
        event: autonomy.alert
      tired:
        pan_delta: 2
        tilt_delta: 2
        event: autonomy.tired
      sadness:
        pan_delta: 3
        tilt_delta: 5
        event: autonomy.sad
      neutral:
        pan_delta: 4
        tilt_delta: 3
        event: autonomy.neutral
  lights:
    default_mode: breathe
    palettes:
      calm_violet:
      - 120
      - 80
      - 255
      sunset_gold:
      - 255
      - 170
      - 60
      alert_red:
      - 255
      - 45
      - 45
      ocean_teal:
      - 30
      - 180
      - 255
      arctic_white:
      - 255
      - 255
      - 255
      forest_green:
      - 60
      - 200
      - 90
      ember_orange:
      - 255
      - 110
      - 40
      polar_blue:
      - 90
      - 150
      - 255
endpoints:
  arduino: '@gateway/arduino'
  neopixel: '@gateway/neopixel'
  speak: '@gateway/speak'
  ollama: '@gateway/ollama'
  speech: '@gateway/speech'
  interactions: '@gateway/interactions'
  expression: '@gateway/expression'
  oled_faces: '@gateway/oled_faces'
  state_manager: '@gateway/state'
  animate: '@gateway/animate'
  vlm: '@gateway/vlm'
  vision: '@gateway/vlm'
  camera: '@gateway/camera'
  notifier: '@gateway/notify'
  autonomy: '@gateway/autonomy'
  agent_core: '@gateway/agent'
owner:
  name: "Emir"
  aliases:
    - "emir"
    - "sahip"
    - "patron"
    - "reis"
  presence_timeout_s: 25
  greeting: "Hoş geldin {name}! Seni gördüğüme çok sevindim."
behaviors:
  idle:
    enabled: true
    actions:
    - look_around
    - blink
    - sigh
    - stretch
    - monologue
  idle_tree:
    enabled: true
    interval_s: 6
    fallback_to_llm: true
    path: modules/autonomy/config/idle_behaviors.yml
  curiosity:
    enabled: true
    face_tracking: true
    sound_reaction: true
  sleep:
    enabled: true
    start_hour: 3
    end_hour: 6
    wake_up_action: stretch
llm:
  enabled: true
  model: qwen3.5:9b
  auto_select_persona: false
  warmup_on_start: true
  prompt_template: 'Sen duyguları olan bir robotsun.


    Şu anki İç Durumun:

    - Mutluluk: {happiness}/100 (Düşükse üzgün, yüksekse neşeli)

    - Enerji: {energy}/100 (Düşükse uykulu/yorgun)

    - Sıkılma: {is_bored} (Evet ise ilgi istiyorsun)

    - Son Etkileşim: {last_interaction_ago} saniye önce

    - Saat: {time}


    GÖREV: Bu duruma uygun, çok kısa (maksimum 10 kelime) bir iç ses cümlesi kur.

    - Robotik değil, canlı bir karakter gibi konuş.

    - Sadece söyleyeceğin cümleyi yaz.

    '
speech_quiet_hours:
  enabled: true
  start: 01:00
  end: 05:00
  tone: calm
  max_chars: 120
  prefix: ''
barge_in:
  enabled: true
  min_words: 2
  cooldown_s: 1.5
liveliness:
  enabled: true
  amplitude_deg: 4.0
  max_amplitude_deg: 12.0
  period_ms: 4500
  refresh_interval_s: 20.0
offline_mode:
  enabled: true
  availability_ttl_s: 5
  fallback_replies:
  - Su an baglanti zayif, ama seni dinliyorum.
  - Cevap motoruna ulasamiyorum, kisa sure sonra tekrar deneyelim.
  - Simdi yerel moddayim, yine de yanindayim.
  persona_replies:
    joy:
    - Baglanti yok ama modum yerinde, devam edelim.
    - Yerel moddayim ve enerjim yuksek, hazirim.
    curiosity:
    - Baglanti kopuk, yine de seni anlamaya devam ediyorum.
    - Cevap motoru yok ama merakim acik, devam et.
    tired:
    - Biraz yavasim ama buradayim, baglanti gelir gelmez deneriz.
    - Yerel moddayim, sakin ve yavas cevap verecegim.
    fear:
    - Sistem baglantisi zayif, simdilik guvenli moddayim.
    - Baglanti kararsiz, kontrollu hareket ediyorum.
    neutral:
    - Su an yerel moddayim, yine de cevap verebilirim.
    - Baglanti beklemede, ama ben buradayim.
  contextual_replies:
    question:
    - Su an ag cevabi alamiyorum, ama sorunu not ettim.
    - Bunu cevaplamak istiyorum; baglanti gelir gelmez tekrar deneyeyim.
    command:
    - Komutu duydum, baglanti toparlaninca tam uygulayacagim.
    - Simdilik yerel moddayim, temel tepkilerle devam ediyorum.
    greeting:
    - Merhaba, baglanti olmasa da buradayim.
    - Selam, yerel modda da seninleyim.
    generic:
    - Baglanti gecici olarak yok, ama etkileşim devam ediyor.
request_timeouts:
  default_post_s: 1.0
  default_get_s: 0.8
  ollama_chat_s: 18.0
  ollama_warmup_s: 2.5
  speech_min_interval_s: 0.35
agentic:
  enabled: true
  min_interval_s: 45
  fallback_random_chance: 0.12
  triggers:
    social_need: 72
    stimulation_need: 68
    low_energy: 25
    low_rest: 22
speech_reactions:
  excited_on_speech: false
  excited_on_praise: true
  excited_on_questions: false
visual_state:
  emotion_min_interval_s: 1.8
  default_lock_s: 2.4
  strong_lock_s: 4.8
  state_hold_s: 3.2
  strong_emotions:
  - fear
  - angry
  - furious
  transition_graph:
    neutral:
    - curiosity
    - joy
    - tired
    - sad
    - fear
    - angry
    - furious
    curiosity:
    - joy
    - neutral
    - sad
    - fear
    - angry
    joy:
    - neutral
    - curiosity
    - tired
    - sad
    sad:
    - neutral
    - curiosity
    - fear
    tired:
    - neutral
    - sad
    angry:
    - neutral
    - fear
    - furious
    furious:
    - angry
    - fear
    - neutral
    fear:
    - neutral
    - curiosity
    - angry
companion:
  enabled: true
  relationship_memory_path: modules/autonomy/data/relationship_memory.json
  rituals:
    enabled: true
    morning_window_h:
    - 6
    - 11
    owner_return_min_absence_s: 180
    owner_return_cooldown_s: 300
  proactive:
    enabled: true
    cooldown_s: 75
    min_idle_s: 50
    max_per_hour: 4
    owner_only: false
    callback_min_trust: 0.2
    scene_comment_min_importance: 0.45
    policy:
      owner_style: warm
      guest_style: respectful
  lines:
    use_llm: true
    max_words: 18
    llm_cooldown_s: 35
    default_language: tr
  voice_ai_tools: true
  emotion_command_shortcut: false
  owner_sessions:
    enabled: true
    source: vision
speech:
  use_stream_tts: true
  stream_poll_interval_s: 0.12
  stream_max_wait_s: 90
  stream_max_chunk_chars: 220
  learning:
    enabled: true
    feedback:
      enabled: true
      trust_min: 0.0
      trust_max: 1.0
      deltas:
        user_praise:
          trust: 0.08
          salience: 0.5
        user_rude:
          trust: -0.12
          salience: 0.55
sound_direction:
  poll_interval_s: 2.0
vision_hooks:
  enabled: true
  poll_interval_s: 5
  forward_interval_s: 8
  max_results: 5
  person_cooldown_s: 25
  ignore_labels:
  - chair
  - tv
  prefer_llm_greetings: true
  speak_on_unknown: false
  importance_speak_threshold: 0.6
  focus:
    jitter_min: -3
    jitter_max: 3
    deadband_deg: 2
    smoothing: 0.55
  dynamic_cooldown:
    enabled: true
    near_distance_m: 1.2
    far_distance_m: 3.0
    near_multiplier: 0.6
    far_multiplier: 1.3
  empathy:
    enabled: true
    cooldown_s: 28
    mirror:
    - joy
    - sadness
    - fear
    - worried
    speak_on_mirror: true
empathy:
  enabled: true
  cooldown_s: 28
