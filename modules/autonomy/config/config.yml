owner:
  enabled: true
  name: Emir
  aliases:
  - Emir
  - WhoIsMrSentry
  addressing:
    affectionate: Emir
    formal: Emir
    handle: Emir
  presence_timeout_s: 30
  require_presence: false
  max_requests_without_owner: 3
  cooldown_s: 15
  speaker_window_s: 10
  polite_message: Sahip yokken de isteğini yerine getirebilirim.
  angry_message: Emir yokken beni zorlamanı istemiyorum.
  cooldown_message: Emir gelene kadar konuşmak istemiyorum.
  greeting: Hoş geldin Emir! Seni gördüğüme çok sevindim.
  restricted_keywords:
  - format
  - kendini kapat
  - delete
  rfid:
    endpoint: '@gateway/arduino/rfid/authorize'
    grace_s: 120
    poll_interval_s: 15
world_memory:
  enabled: true
  db_path: data/world_memory.sqlite3
  max_context_items: 8
  default_confidence: 0.55
  default_expiry_s: 900
living_needs:
  enabled: true
  idle_boredom_s: 90
  alone_social_s: 180
  curiosity_decay_s: 150
  rest_energy_threshold: 0.28
  sound_attention_hold_s: 18
  person_attention_hold_s: 45
safe_navigation:
  enabled: true
  places_path: data/safe_places.json
  allow_base_motion: false
  default_rest_place: quiet_corner
  rest_pose:
    pan: 90
    tilt: 125
pi_hardware_runtime:
  require_pi: true
  require_camera: true
  require_esp: false
  esp_health_timeout_s: 0.4
topomap_motion:
  enabled: true
  map_path: data/topomap_places.json
  allow_base_motion: false
  require_ultrasonic_clearance: true
  min_clearance_cm: 28.0
  companion_policies:
    safe_exploration:
      enabled: true
      required_tags: [safe, exploration]
      selection: random
      selection_seed: 2701
      max_attempts: 2
      fallback_behavior: quiet_observation
    social_distance:
      enabled: true
      required_tags: [safe, social_distance]
      minimum_distance_from_owner_m: 1.2
      selection: random
      selection_seed: 2701
      max_attempts: 2
      fallback_behavior: quiet_observation
  place_validation:
    allowed_tags: [safe, exploration, social_distance, owner_zone, quiet, restricted]
    safe_required_for: [exploration, social_distance]
    distance_required_for: [social_distance]
    motion_required_for: [safe, exploration, social_distance]

owner_learning:
  enabled: true
  profile_path: data/owner_profile.json
  min_confidence: 0.55

companion_goals:
  enabled: true
  event_cooldown_s: 12.0
  autonomy_policy:
    uncertainty:
      enabled: true
      confidence_paths: [perception.confidence, perception.vision_confidence, perception.audio_confidence]
      hold_below: 0.45
      fallback_semantic: quiet_observation
      suppress_action_types: [navigation, motion]
      reason: low_observation_confidence
    personalization:
      enabled: true
      rules:
        - signal_paths: [preferences.quiet_mode, relationship.preferences.quiet_mode]
          when: true
          suppress_action_types: [speech]
          semantic: quiet_observation
          reason: owner_prefers_quiet
