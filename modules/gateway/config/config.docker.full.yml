server:
  host: 0.0.0.0
  port: 8080

# Full Docker profili:
# Tum moduller include edilir.
# Donanim olmayan ortamlarda autostart'i compose override uzerinden kapatmak onerilir.
include:
  arduino: true
  vlm_bridge: true
  neopixel: true
  interactions: true
  speak: true
  speech: true
  wakeword: true
  ollama: true
  camera: false
  logs: true
  animate: true
  piservo: true
  autonomy: true
  ota: true
  mutagen: true
  hardware: true
  telemetry: true
  diagnostics: true
  state_manager: true
  oled_faces: true
  scheduler: true
  notifier: true
  calibration: true
  config_center: true

speech:
  listening: false

security:
  enabled: false
  api_key_header: X-API-Key
  role_header: X-Role
  api_keys: []
  admin_keys: []
  # Hassas GET/HEAD uclari: security.enabled=true olursa bu prefixlerle
  # eslesen okuma istekleri (kamera, son konusma, durum, telemetri, vlm,
  # agent/autonomy/sosyal) trust_loopback disindan gecerli bir API key ister.
  protected_get_prefixes:
    - /camera
    - /speech/last
    - /speech/direction
    - /speech/track
    - /state
    - /telemetry
    - /vlm
    - /agent
    - /autonomy
    - /social
