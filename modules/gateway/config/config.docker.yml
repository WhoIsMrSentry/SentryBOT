server:
  host: 0.0.0.0
  port: 8080

# Docker varsayilanlari:
# - Donanim bagimli moduller kapali gelir.
# - Uygulama cekirdegi ve gateway/api modulleri acik gelir.
include:
  arduino: false
  vlm_bridge: false
  neopixel: false
  interactions: false
  speak: false
  speech: false
  wakeword: false
  ollama: true
  camera: false
  logs: true
  animate: false
  piservo: false
  autonomy: false
  ota: false
  mutagen: false
  hardware: false
  telemetry: true
  diagnostics: true
  state_manager: true
  oled_faces: false
  scheduler: true
  notifier: false
  calibration: false
  config_center: true

speech:
  listening: false

security:
  enabled: false
  api_key_header: X-API-Key
  role_header: X-Role
  api_keys: []
  admin_keys: []
  # Hassas GET/HEAD uclari: security.enabled=true olursa bu prefixlerle
  # eslesen okuma istekleri (kamera, son konusma, durum, telemetri, vlm,
  # agent/autonomy/sosyal) trust_loopback disindan gecerli bir API key ister.
  protected_get_prefixes:
    - /camera
    - /speech/last
    - /speech/direction
    - /speech/track
    - /state
    - /telemetry
    - /vlm
    - /agent
    - /autonomy
    - /social
