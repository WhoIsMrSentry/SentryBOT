[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    ".venv",
    "venv",
    "vendor",
    "3d_Print",
    ".ruff_cache",
]

[tool.ruff.lint]
# Undefined names, unused imports, and lightweight correctness rules enforced in CI.
# Re-exports in package __init__ modules stay imported on purpose.
select = [
    "E9",
    "F401",
    "F811",
    "F821",
    "F823",
    "F841",
    "B006",
    "B012",
    "B015",
    "B018",
    "B023",
    "B029",
    "B032",
    "UP004",
    "UP010",
    "UP011",
    "UP018",
    "UP021",
    "UP024",
    "UP025",
    "UP029",
    "UP032",
    "UP034",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "services/remote_multimodal_server/tests",
    "services/remote_tts_server/tests",
]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
